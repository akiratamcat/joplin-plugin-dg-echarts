name: Bug report / 不具合の報告
description: Something does not work as expected. / 期待どおりに動かない。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: English or Japanese is fine. / 英語でも日本語でもかまいません。
  - type: input
    id: plugin-version
    attributes:
      label: dg-echarts version / dg-echarts のバージョン
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: joplin-version
    attributes:
      label: Joplin version / Joplin のバージョン
      description: Help → About Joplin / ヘルプ → Joplin について
      placeholder: e.g. 3.7.22
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system / OS
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Chart source (JSON or YAML) / グラフのソース（JSON か YAML）
      description: The smallest source that shows the problem. Please remove private information. / 問題が起きるいちばん小さなソース。個人の情報は消してください。
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens, and what you expected / 何が起きたか、どうなるはずだったか
      description: Screenshots help. Where does it happen? Note viewer, Rich Text editor, Markdown editor or an export. / 画面のキャプチャがあると助かります。ノートビューア、リッチテキストエディタ、Markdown エディタ、エクスポートのどこで起きますか。
    validations:
      required: true
